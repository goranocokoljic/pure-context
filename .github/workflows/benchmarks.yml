name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install UI dependencies
        run: npm --prefix src/ui ci

      - name: Build
        run: npm run build

      - name: Run token efficiency benchmark
        run: npm run benchmark:competitive

      - name: Post results as commit comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'test/benchmarks/results/results.md';
            if (!fs.existsSync(resultPath)) {
              console.log('No benchmark results to post.');
              return;
            }
            const body = fs.readFileSync(resultPath, 'utf8').slice(0, 65000);

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });
            if (commits.length === 0) return;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commits[0].sha,
              body,
            });
