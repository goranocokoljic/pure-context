name: Benchmarks

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run PureContext benchmark
        run: npm run bench:purecontext

      - name: Check for regression vs baseline
        run: |
          node -e "
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('benchmarks/results/purecontext.json', 'utf8'));
            const baselinePath = 'benchmarks/results/baseline.json';
            if (!fs.existsSync(baselinePath)) {
              console.log('No baseline.json found — skipping regression check.');
              process.exit(0);
            }
            const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
            const currentMs = current.indexing.duration_ms;
            const baselineMs = baseline.indexing.duration_ms;
            const regressionPct = ((currentMs - baselineMs) / baselineMs) * 100;
            console.log('Baseline indexing: ' + baselineMs + 'ms');
            console.log('Current indexing:  ' + currentMs + 'ms');
            console.log('Change: ' + regressionPct.toFixed(1) + '%');
            if (regressionPct > 20) {
              console.error('REGRESSION: indexing speed degraded by ' + regressionPct.toFixed(1) + '% (threshold: 20%)');
              process.exit(1);
            }
            console.log('OK — within threshold.');
          "

      - name: Post results as commit comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = 'benchmarks/results/purecontext.json';
            if (!fs.existsSync(resultPath)) {
              console.log('No benchmark results to post.');
              return;
            }
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const body = [
              '## Weekly Benchmark Results',
              '',
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              `**Indexing:** ${result.indexing.duration_ms}ms for ${result.indexing.file_count} files (${result.indexing.symbol_count} symbols)`,
              '',
              'Full results in `benchmarks/results/purecontext.json`.',
            ].join('\n');

            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1,
            });
            if (commits.length === 0) return;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commits[0].sha,
              body,
            });
