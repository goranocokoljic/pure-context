name: PureContext Analysis
description: Index codebase, detect anti-patterns, analyze PR blast radius, and upload the index bundle
author: PureContext

branding:
  icon: search
  color: blue

inputs:
  token:
    description: GitHub token for posting PR comments
    required: true
  anthropic-api-key:
    description: Optional — enable AI-powered symbol summaries
    required: false
    default: ''
  analyze-diff:
    description: Post a blast radius comment on pull requests
    required: false
    default: 'true'
  detect-antipatterns:
    description: Fail CI when error-severity anti-patterns are found
    required: false
    default: 'false'
  upload-index:
    description: Upload the .pcx index bundle as a workflow artifact
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # ── Cache: restore the index from a previous run on the same SHA ────────
    - name: Restore PureContext index cache
      uses: actions/cache@v4
      with:
        path: ~/.purecontext/indexes
        key: purecontext-index-${{ github.sha }}
        restore-keys: |
          purecontext-index-

    # ── Index the repository ─────────────────────────────────────────────────
    - name: Index repository
      shell: bash
      run: npx purecontext-mcp index-folder --path "${{ github.workspace }}"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}

    # ── Analyze the PR diff and write JSON to a temp file ────────────────────
    - name: Analyze diff (on PR)
      if: github.event_name == 'pull_request' && inputs.analyze-diff == 'true'
      shell: bash
      run: |
        git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pctx-pr.diff
        npx purecontext-mcp analyze-diff \
          --diff-file /tmp/pctx-pr.diff \
          --repo "${{ github.workspace }}" \
          > /tmp/pctx-analysis.json || true

    # ── Post the impact report as a PR comment ───────────────────────────────
    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.analyze-diff == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          let analysis;
          try {
            analysis = JSON.parse(fs.readFileSync('/tmp/pctx-analysis.json', 'utf8'));
          } catch {
            console.log('No analysis output found — skipping PR comment');
            return;
          }

          const priorityEmoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🟢' };
          const priority = analysis.reviewPriority ?? 'low';
          const emoji = priorityEmoji[priority] ?? '⚪';
          const { summary = {}, changedSymbols = [], blastRadius } = analysis;
          const blastFiles = blastRadius?.filesImpacted ?? 0;
          const sigBreaks = summary.signatureBreaks ?? 0;

          let body = '## PureContext Analysis\n\n';
          body += `**Impact Summary**: ${summary.symbolsModified ?? 0} symbols modified, blast radius: ${blastFiles} files\n`;
          body += `**Review Priority**: ${emoji} ${priority.charAt(0).toUpperCase() + priority.slice(1)}`;
          if (sigBreaks > 0) {
            body += ` (${sigBreaks} signature break${sigBreaks === 1 ? '' : 's'} detected)`;
          }
          body += '\n\n';

          if (changedSymbols.length > 0) {
            body += '| Symbol | Change | Blast Radius |\n';
            body += '|--------|--------|------------|\n';
            for (const sym of changedSymbols.slice(0, 10)) {
              const changeLabel = sym.changeType === 'signature_changed'
                ? 'Signature changed'
                : sym.changeType.charAt(0).toUpperCase() + sym.changeType.slice(1);
              body += `| \`${sym.name}()\` | ${changeLabel} | — |\n`;
            }
            if (changedSymbols.length > 10) {
              body += `\n_…and ${changedSymbols.length - 10} more changed symbols_\n`;
            }
          }

          body += '\n<sub>Generated by [PureContext](https://github.com/purecontext/purecontext-mcp)</sub>';

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });

    # ── Anti-pattern scan — optional hard failure ─────────────────────────────
    - name: Detect anti-patterns
      if: inputs.detect-antipatterns == 'true'
      shell: bash
      run: |
        npx purecontext-mcp detect-antipatterns \
          --repo "${{ github.workspace }}" \
          --fail-on-critical

    # ── Export the index bundle ───────────────────────────────────────────────
    - name: Export index bundle
      if: inputs.upload-index == 'true'
      shell: bash
      run: npx purecontext-mcp export --auto

    # ── Upload the .pcx bundle as a workflow artifact ─────────────────────────
    - name: Upload index bundle
      if: inputs.upload-index == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: purecontext-index
        path: '*.pcx'
        if-no-files-found: warn
